# Chạy website kèm HTTPS tự động.
#
#   DOMAIN=sakuratei.example.com docker compose up -d --build
#
# Caddy tự xin và tự gia hạn chứng chỉ Let's Encrypt, nên không phải chạy certbot
# hay cron gì thêm. Điều kiện: tên miền trong DOMAIN đã trỏ bản ghi A về IP server,
# và cổng 80 với 443 của server mở ra Internet.

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    # Không publish cổng ra ngoài: chỉ Caddy được nói chuyện với app,
    # nhờ vậy không ai vào thẳng bằng HTTP được.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?Thieu bien DOMAIN. Vi du - DOMAIN=sakuratei.example.com docker compose up -d}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Giữ chứng chỉ qua các lần khởi động lại. Mất volume này là phải xin
      # chứng chỉ mới, mà Let's Encrypt có giới hạn số lần cấp mỗi tuần.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
