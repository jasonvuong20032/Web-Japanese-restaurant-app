<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/sakura.svg" />

    <title>Sakura Tei · Ẩm thực Nhật Bản</title>
    <meta
      name="description"
      content="Sakura Tei — nhà hàng Nhật với 120 món sushi, sashimi, ramen, udon, BBQ, tráng miệng và thức uống. Đặt món giao tận nơi hoặc đặt bàn trực tuyến."
    />
    <meta name="theme-color" content="#FBF7F0" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sakura Tei · Ẩm thực Nhật Bản" />
    <meta
      property="og:description"
      content="120 món Nhật chuẩn vị: sushi, sashimi, ramen, udon, BBQ than hoa, tráng miệng và matcha Uji."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Áp dụng dark mode trước khi React dựng cây để tránh nháy trắng lúc tải.
      (function () {
        try {
          var saved = localStorage.getItem('sakura-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark')
          }
        } catch (_) {
          /* localStorage bị chặn — cứ dùng giao diện sáng */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
